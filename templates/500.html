<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Server Error | HireHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc, #eef2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #172033;
        }

        .error-card {
            width: 90%;
            max-width: 650px;
            background: white;
            border-radius: 24px;
            padding: 55px 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        }

        .error-code {
            font-size: 100px;
            font-weight: 800;
            color: #ef4444;
            line-height: 1;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .btn-home {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 12px;
            background: #172033;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-home:hover {
            background: #334155;
            color: white;
        }

        .tip {
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="error-card">

        <div class="error-code">500</div>

        <h1>Something Went Wrong</h1>

        <p>
            Sorry, something went wrong on our server.
            Please try again in a few moments.
        </p>

        <a href="{% url 'accounts:dashboard' %}" class="btn-home">
            ← Back to Dashboard
        </a>

        <div class="tip">
            HireHub • Connecting talent with opportunity
        </div>

    </div>

</body>

</html>
