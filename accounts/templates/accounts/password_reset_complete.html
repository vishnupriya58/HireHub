<!DOCTYPE html>
<html>

<head>
    <title>Password Reset Complete - HireHub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 400px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #16a34a;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Password Changed Successfully ✅</h2>

        <p>
            Your HireHub password has been reset successfully.
        </p>

        <p>
            You can now login using your new password.
        </p>

        <a href="{% url 'accounts:login' %}">
            Login to HireHub
        </a>

    </div>

</body>

</html>
