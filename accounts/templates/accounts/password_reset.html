{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | HireHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f5f3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .reset-card {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 24px;
            padding: 42px;
            box-shadow: 0 20px 60px rgba(67, 56, 202, 0.12);
        }

        .logo {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #4f46e5;
            text-align: center;
            margin-bottom: 30px;
        }

        .icon-box {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: #eef2ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        h1 {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 700;
            text-align: center;
            color: #17172b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        input[type="email"] {
            width: 100%;
            border: 1px solid #d9d9e8;
            border-radius: 12px;
            padding: 13px 15px;
            outline: none;
            transition: 0.2s;
        }

        input[type="email"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.10);
        }

        .btn-reset {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 14px;
            margin-top: 20px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-reset:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.25);
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .errorlist {
            color: #dc2626;
            font-size: 13px;
            padding-left: 0;
            list-style: none;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <div class="reset-card">

        <div class="logo">HireHub</div>

        <div class="icon-box">
            🔐
        </div>

        <h1>Forgot your password?</h1>

        <p class="subtitle">
            Enter your registered email address and we'll send you a link to reset your password.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.email.errors }}

            <label for="{{ form.email.id_for_label }}">
                Email address
            </label>

            {{ form.email }}

            <button type="submit" class="btn-reset">
                Send Reset Link
            </button>
        </form>

        <a href="{% url 'accounts:login' %}" class="back-login">
            ← Back to Login
        </a>

    </div>

</body>

</html>
