<!DOCTYPE html>
<html>

<head>
    <title>Password Reset</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
            max-width: 450px;
        }

        h2 {
            color: #2563eb;
        }

        p {
            color: #555;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Check Your Email 📧</h2>

        <p>
            If an account exists with the email address you entered,
            we have sent instructions to reset your password.
        </p>

        <a href="{% url 'accounts:login' %}">Back to Login</a>
    </div>
</body>

</html>
